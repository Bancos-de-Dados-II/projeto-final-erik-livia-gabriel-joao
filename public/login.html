<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | EcoPontos</title>

    <link
        rel="stylesheet"
        href="./css/login.css"
    >
</head>

<body>
    <main class="pagina-login">
        <section class="cartao-login">
            <header class="cabecalho-login">
                <div class="icone-logo">♻️</div>

                <h1>EcoPontos</h1>

                <p>
                    Entre para acessar a plataforma.
                </p>
            </header>

            <form id="form-login" class="formulario-login">
                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="mensagem-login"
                    class="mensagem-login"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="botao-entrar"
                >
                    Entrar
                </button>
            </form>
        </section>
    </main>

    <script src="./js/login.js"></script>
</body>
</html>
