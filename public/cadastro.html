<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | EcoPontos</title>

    <link
        rel="stylesheet"
        href="./css/login.css"
    >
</head>

<body>
    <main class="pagina-login">
        <section class="cartao-login">
            <header class="cabecalho-login">
                <div class="icone-logo">♻️</div>

                <h1>Criar conta</h1>

                <p>
                    Cadastre-se para acessar o EcoPontos.
                </p>
            </header>

            <form
                id="form-cadastro-usuario"
                class="formulario-login"
            >
                <div class="campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        minlength="4"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <p
                    id="mensagem-cadastro"
                    class="mensagem-login"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="botao-cadastrar"
                >
                    Criar conta
                </button>

                <p class="link-autenticacao">
                    Já possui uma conta?

                    <a href="./login.html">
                        Entrar
                    </a>
                </p>
            </form>
        </section>
    </main>

    <script src="./js/cadastro.js"></script>
</body>
</html>
